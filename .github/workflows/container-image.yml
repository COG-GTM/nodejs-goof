name: container-image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Existing tests and smoke test (Node 22)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:3.6
        ports: ["27017:27017"]
      mysql:
        image: mysql:5.7
        ports: ["3306:3306"]
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}
          MYSQL_DATABASE: acme
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-retries 30
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/express-todo
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-${{ github.run_id }}
      MYSQL_DATABASE: acme
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The repo's only test script is `snyk test`. This app is an intentionally
      # vulnerable demo, so the scan reports issues by design; it must run but does not gate the build.
      - name: Existing tests (npm test = snyk test)
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: npm test

      - name: Smoke test against MongoDB and MySQL
        run: |
          node app.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3001/healthz && break; sleep 2; done
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3001/readyz && break; sleep 2; done
          curl -fs http://127.0.0.1:3001/readyz
          curl -fs -o /dev/null http://127.0.0.1:3001/
          curl -fs -o /dev/null -X POST -d 'content=ci smoke in 1 day' http://127.0.0.1:3001/create
          curl -fs http://127.0.0.1:3001/ | grep -q 'ci smoke'
          curl -fs http://127.0.0.1:3001/users | grep -q '"id":1'
      - name: App log
        if: always()
        run: cat app.log || true

  image:
    name: Build linux/amd64 image
    needs: test
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.INTERNAL_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: nodejs-goof:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Internal registry only; runs when the registry secrets are configured.
      - name: Log in to internal registry
        if: ${{ github.event_name == 'push' && env.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.INTERNAL_REGISTRY }}
          username: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
      - name: Push to internal registry
        if: ${{ github.event_name == 'push' && env.REGISTRY != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/nodejs-goof:${{ github.sha }}
          cache-from: type=gha
