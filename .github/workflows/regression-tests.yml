name: "Regression tests"
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    name: regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:regression
