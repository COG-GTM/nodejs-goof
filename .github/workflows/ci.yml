name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit + integration tests, OpenAPI validation
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t goof:ci .
