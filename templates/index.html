{% extends "base.html" %}

{% block body %}
<style>
strong {font-weight: bold}
</style>

<div class="patch-header">
  <img class="snyk-patch" src="/public/images/snyk_patch.jpeg" />
  <h1 id="page-title">{{ title }}</h1>
</div>

<div id="list">
  <form action="/create" method="post" accept-charset="utf-8">
    <div class="item-new">
      <input class="input" type="text" name="content" />
    </div>
  </form>

{% for todo in todos %}
  <div class="item">
    <a class="update-link" href="/edit/{{ todo.id }}" title="Update this todo item">{{ todo.content | markdown | safe }}</a>
    <a class="del-btn" href="/destroy/{{ todo.id }}" title="Delete this todo item">Delete</a>
  </div>
{% endfor %}
</div>
{% endblock %}
