services:
  goof:
    build: .
    container_name: goof
    environment:
      MONGODB_URI: mongodb://goof-mongo:27017/express-todo
      MYSQL_URL: jdbc:mysql://goof-mysql:3306/acme?createDatabaseIfNotExist=true
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3001:3001"
    depends_on:
      goof-mongo:
        condition: service_started
      goof-mysql:
        condition: service_healthy
  goof-mongo:
    container_name: goof-mongo
    image: mongo:7
    ports:
      - "27017:27017"
  goof-mysql:
    container_name: goof-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: acme
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP"]
      interval: 5s
      retries: 20
