version: "2.1"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MYSQL_HOST=goof-mysql
      - MYSQL_USER=${MYSQL_USER:-goof}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the environment or a .env file}
      - MYSQL_DATABASE=acme
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
      - good-mysql
    depends_on:
      goof-mongo:
        condition: service_started
      good-mysql:
        condition: service_healthy
  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
  good-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: acme
      MYSQL_USER: ${MYSQL_USER:-goof}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the environment or a .env file}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' acme"]
      interval: 5s
      timeout: 5s
      retries: 30
