version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - ADMIN_USERNAME=admin@snyk.io
      - MYSQL_HOST=goof-mysql
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3001:3001"
      - "9229:9229"
    depends_on:
      - goof-mongo
      - goof-mysql
  goof-mongo:
    container_name: goof-mongo
    image: mongo:6
    ports:
      - "27017:27017"
  goof-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: acme
    ports:
      - "3306:3306"
