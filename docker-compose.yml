version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MYSQL_HOST=goof-mysql
      - MYSQL_USER=${MYSQL_USER:-goof}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the environment or a .env file}
      - MYSQL_DATABASE=acme
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
      - good-mysql
    depends_on:
      - goof-mongo
      - good-mysql
  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
  good-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: acme
      MYSQL_USER: ${MYSQL_USER:-goof}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the environment or a .env file}
