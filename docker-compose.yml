version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MYSQL_HOST=good-mysql
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - ADMIN_PASSWORD
      - SESSION_SECRET
      - CHAT_USER_PASSWORD
    ports:
      - "3001:3001"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
      - good-mysql
  goof-mongo:
    container_name: goof-mongo
    image: mongo:7
    ports:
      - "27017:27017"
  good-mysql:
    container_name: goof-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "3306:3306"
