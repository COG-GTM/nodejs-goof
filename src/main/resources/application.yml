server:
  port: ${PORT:3001}
  shutdown: graceful

spring:
  application:
    name: goof
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:${MONGOLAB_URI:mongodb://localhost:27017/express-todo}}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/acme?createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: true

goof:
  admin:
    username: ${GOOF_ADMIN_USERNAME:admin@snyk.io}
    # Demo credential documented in the README; override with GOOF_ADMIN_PASSWORD outside local demos.
    password: ${GOOF_ADMIN_PASSWORD:SuperSecretPassword}

springdoc:
  default-produces-media-type: application/json
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.snyk.goof: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
logging:
  level:
    io.snyk.goof: DEBUG
