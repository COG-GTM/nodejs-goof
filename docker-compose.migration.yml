# Local proof stack for the app migration wave: app + its real datastores + MinIO as the S3 stand-in.
# Secrets come from the shell environment by name only:
#   GOOF_MYSQL_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
services:
  app:
    build: .
    image: nodejs-goof:migration
    environment:
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/express-todo
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${GOOF_MYSQL_PASSWORD:?set GOOF_MYSQL_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: on-failure

  mongo:
    image: mongo:3.6
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${GOOF_MYSQL_PASSWORD:?set GOOF_MYSQL_PASSWORD}
      MYSQL_DATABASE: acme
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  mysql-data:
  minio-data:
